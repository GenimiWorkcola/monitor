<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>央行资金面监控面板</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: "PingFang SC","Microsoft YaHei",sans-serif; background:#f5f6fa; color:#2c3e50; }
  .container { max-width:1200px; margin:0 auto; padding:24px 20px 48px; }
  header { display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  h1 { font-size:22px; font-weight:600; }
  .meta { font-size:13px; color:#7f8c9b; }
  #warning { display:none; background:#fdecea; color:#c0392b; border:1px solid #f5c6cb; border-radius:8px;
             padding:10px 16px; font-size:14px; margin-bottom:16px; }
  #dropzone { border:2px dashed #b8c4d9; border-radius:12px; background:#fff; padding:22px;
              text-align:center; color:#7f8c9b; font-size:14px; margin-bottom:20px; cursor:pointer;
              transition:all .2s; }
  #dropzone:hover, #dropzone.dragover { border-color:#9DB2F5; background:#f4f6ff; color:#5a6b9d; }
  #dropzone .hint-strong { font-size:15px; color:#4a5a7d; margin-bottom:4px; }
  .omo-controls { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:10px 14px;
                  margin:-8px 0 20px; padding:12px 16px; background:#fff; border:1px solid #e3e8f0; border-radius:10px;
                  color:#4a5a7d; font-size:13px; }
  .omo-controls label { display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .omo-controls input { width:112px; padding:7px 9px; border:1px solid #cbd5e1; border-radius:6px; color:#2c3e50;
                        font:inherit; background:#fff; }
  .omo-controls input:focus { outline:2px solid #9DB2F5; border-color:#3080ff; }
  .omo-controls button { padding:8px 16px; border:0; border-radius:6px; background:#3080ff; color:#fff;
                         font:inherit; cursor:pointer; }
  .omo-controls button.secondary { background:#eef2f7; color:#4a5a7d; }
  .omo-controls button:focus-visible { outline:3px solid #9DB2F5; outline-offset:2px; }
  #omoOverrideStatus { flex-basis:100%; text-align:center; color:#7f8c9b; font-size:12px; }
  .card { background:#fff; border-radius:12px; padding:16px 12px 8px; margin-bottom:20px;
          box-shadow:0 1px 4px rgba(30,40,60,.06); }
  .card h2 { font-size:15px; font-weight:600; color:#4a5a7d; padding:0 8px 8px; }
  .level-legend { display:flex; flex-wrap:wrap; gap:8px 14px; padding:8px 8px 6px; border-top:1px dashed #e3e8f0; margin-top:4px; }
  .level-item { display:flex; align-items:center; gap:6px; font-size:12px; color:#5a6b80; }
  .level-dot { width:11px; height:11px; border-radius:50%; flex:none; }
  .level-name { font-weight:600; color:#3d4c63; }
  .level-desc { color:#8a97a8; }
  #chart1 { height:380px; } #chart2 { height:320px; }
  #chart3 { height:480px; }

  #status { font-size:12px; color:#718096; text-align:center; margin-top:8px; line-height:1.7; }
  #dropzone:focus-visible { outline:3px solid #3080ff; outline-offset:3px; }
  @media (max-width:600px) {
    .container { padding:16px 10px 32px; }
    .card { padding:14px 4px 8px; }
    .omo-controls { padding:12px 10px; gap:10px; }
    .omo-controls input { width:100px; }
    #chart1 { height:420px; } #chart2 { height:360px; } #chart3 { height:540px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>央行资金面监控面板</h1>
    <div class="meta" id="rangeInfo"></div>
  </header>
  <div id="warning"></div>
  <div id="dropzone" role="button" tabindex="0" aria-label="选择央行资金面 Excel 文件">
    <div class="hint-strong">把更新后的 Excel 拖到这里，即可刷新图表</div>
    <div>支持 liquidity_data.xlsx（一份 Excel 同时刷新三张图）</div>
    <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none">
  </div>
  <div class="omo-controls" aria-label="自定义 OMO 利率">
    <label for="customOmo1d">OMO 1D（%）<input id="customOmo1d" type="number" min="0" max="20" step="0.01" placeholder="默认"></label>
    <label for="customOmo7d">OMO 7D（%）<input id="customOmo7d" type="number" min="0" max="20" step="0.01" placeholder="默认"></label>
    <button id="applyOmoBtn" type="button">应用刷新</button>
    <button id="resetOmoBtn" class="secondary" type="button">恢复默认</button>
    <div id="omoOverrideStatus">留空使用数据表默认 OMO 利率；自定义值仅覆盖当前页面，不改写 Excel</div>
  </div>
  <div class="card"><h2>逆回购净投放 &amp; 资金面概况（近六个月）</h2>
  <div id="chart1"></div>
    <div class="level-legend">
      <div class="level-item"><span class="level-dot" style="background:#d62728"></span><span class="level-name">偏紧</span><span class="level-desc">资金供给紧张，价格上行压力大</span></div>
      <div class="level-item"><span class="level-dot" style="background:#ff7f0e"></span><span class="level-name">均衡偏紧</span><span class="level-desc">供需略有缺口，边际收敛</span></div>
      <div class="level-item"><span class="level-dot" style="background:#1f77b4"></span><span class="level-name">均衡</span><span class="level-desc">供需大体平衡</span></div>
      <div class="level-item"><span class="level-dot" style="background:#98df8a"></span><span class="level-name">均衡偏松</span><span class="level-desc">资金相对充裕，价格稳中趋降</span></div>
      <div class="level-item"><span class="level-dot" style="background:#2ca02c"></span><span class="level-name">偏松</span><span class="level-desc">资金充沛，价格下行</span></div>
    </div>
  </div>
  <div class="card"><h2>Shibor 利率走势</h2><div id="chart2"></div></div>
  <div class="card"><h2>DR001、R001 与 OMO 利率；成交量比值及 DR-D 价差（最近 14 天）</h2><div id="chart3"></div></div>
  <div id="status"></div>
</div>
<script src="../assets/xlsx.full.min.js"></script>
<script src="../assets/echarts.min.js"></script>

function classify(s){
  if(!s) return 2;
  s = String(s);
  if(s.indexOf('均衡偏紧')>=0) return 1;
  if(s.indexOf('均衡偏松')>=0 || s.indexOf('稍松')>=0 || s.indexOf('趋松')>=0 || s.indexOf('转松')>=0) return 3;
  if(s.indexOf('偏紧')>=0) return 0;
  if(s.indexOf('偏松')>=0) return 4;
  return 2;
}

function toNumber(value){
  if(value === null || value === undefined || value === '' || value === '---') return null;
  const n = Number(value);
  return Number.isFinite(n) ? n : null;
}

function dateText(value){
  if(value instanceof Date){
    return value.getFullYear()+'-'+String(value.getMonth()+1).padStart(2,'0')+'-'+String(value.getDate()).padStart(2,'0');
  }
  return String(value || '').slice(0,10);
}

function wideToRepo(records){
  const out=[];
  records.forEach(r=>{
    const day=dateText(r['日期']);
    ['R001','R007','DR001','DR007'].forEach(symbol=>{
      const rate=r[symbol+'_加权利率(%)'];
      const volume=r[symbol+'_成交量(亿元)'];
      if(toNumber(rate)===null && toNumber(volume)===null)return;
      out.push({
        '日期':day,'品种':symbol,'加权利率(%)':rate,'成交量(亿元)':volume,
        'OMO_1D':r['OMO_1D'],'OMO_7D':r['OMO_7D'],
        'R001_R007_成交量比值':r['R001_R007_成交量比值'],
        'R001_DR001_价差BP':r['R001_DR001_价差BP']
      });
    });
  });
  return out;
}

function normalize(records){
  return records.map(r => ({
    date: dateText(r['日期']),
    invest: toNumber(r['央行逆回购投放(亿)']),
    mature: toNumber(r['逆回购到期(亿)']),
    net: toNumber(r['净投放(亿)']),
    cond: r['资金面概况'] || '',
    on: toNumber(r['隔夜Shibor']),
    d7: toNumber(r['7天Shibor']),
    m3: toNumber(r['3个月Shibor'])
  })).filter(r => /^\d{4}-\d{2}-\d{2}$/.test(r.date) &&
    [r.invest,r.mature,r.net,r.on,r.d7,r.m3].some(v=>v!==null))
     .sort((a,b)=> a.date < b.date ? -1 : 1);
}

function normalizeRepo(records){
  const byDate = new Map();
  records.forEach(r => {
    const date = dateText(r['日期']);
    const symbol = r['品种'];
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date) || !['R001','R007','DR001'].includes(symbol)) return;
    if(!byDate.has(date)) byDate.set(date, {date});
    const item = byDate.get(date);
    item[symbol+'加权利率'] = toNumber(r['加权利率(%)']);
    item[symbol+'成交量'] = toNumber(r['成交量(亿元)']);
    item.omo1d = toNumber(r['OMO_1D']);
    item.omo7d = toNumber(r['OMO_7D']);
    item.volumeRatio = toNumber(r['R001_R007_成交量比值']);
    item.spreadFromTable = toNumber(r['R001_DR001_价差BP']);
  });
  return Array.from(byDate.values()).map(r => {
    const hasRates = r.R001加权利率 != null && r.DR001加权利率 != null;
    const calculatedSpread = hasRates ? Number(((r.R001加权利率-r.DR001加权利率)*100).toFixed(4)) : null;
    const calculatedRatio = r.R001成交量 != null && r.R007成交量 != null && r.R007成交量 !== 0
      ? Number((r.R001成交量/r.R007成交量).toFixed(4)) : null;
    return {
      ...r,
      spread: r.spreadFromTable != null ? r.spreadFromTable : calculatedSpread,
      volumeRatio: r.volumeRatio != null ? r.volumeRatio : calculatedRatio,
      omo1d: customOmo1d != null ? customOmo1d : r.omo1d,
      omo7d: customOmo7d != null ? customOmo7d : r.omo7d
    };
  }).sort((a,b)=> a.date < b.date ? -1 : 1);
}

function sixMonthData(data){
  const maxD = new Date(data[data.length-1].date+'T00:00:00');
  const cutoff = new Date(maxD);
  cutoff.setMonth(cutoff.getMonth()-6);
  return data.filter(r => new Date(r.date+'T00:00:00') >= cutoff);
}

function fmt(value, digits=2){
  return value === null || value === undefined || Number.isNaN(value) ? '—' : Number(value).toFixed(digits);
}

      {type:'value',name:'资金面',min:-0.5,max:4.5,interval:1,axisLabel:{formatter:v=>LEVELS[v]||''}}
    ],
    dataZoom:[{type:'inside'},{type:'slider',height:18,bottom:8}],
    series:[
      {name:'净投放(亿)',type:'bar',data:d6.map(r=>r.net),itemStyle:{color:'#9DB2F5'},barMaxWidth:14},
      {name:'资金面概况',type:'scatter',yAxisIndex:1,data:d6.map(r=>({value:classify(r.cond),itemStyle:{color:LEVEL_COLORS[classify(r.cond)]}})),symbolSize:10}
    ]
  };

  const opt2 = {
    tooltip:{trigger:'axis',axisPointer:{type:'line',lineStyle:{color:'#D4AF37',width:2}},valueFormatter:v=>v==null?'—':Number(v).toFixed(4)+' %'},
    legend:{data:['隔夜Shibor','7天Shibor','3个月Shibor'],top:0},
    grid:{left:60,right:70,top:40,bottom:60},
    xAxis:{type:'category',data:dates,axisLabel:{rotate:45,fontSize:11}},
    yAxis:{type:'value',name:'%',scale:true,splitLine:{lineStyle:{color:'#eee'}}},
    dataZoom:[{type:'inside'},{type:'slider',height:18,bottom:8}],
    series:[
      {name:'隔夜Shibor',type:'line',data:d6.map(r=>r.on),itemStyle:{color:'#ff6b6b'},showSymbol:false,connectNulls:false,lineStyle:{width:1.8}},
      {name:'7天Shibor',type:'line',data:d6.map(r=>r.d7),itemStyle:{color:'#4ecdc4'},showSymbol:false,connectNulls:false,lineStyle:{width:1.8}},
      {name:'3个月Shibor',type:'line',data:d6.map(r=>r.m3),itemStyle:{color:'#d4af37'},showSymbol:false,connectNulls:false,lineStyle:{width:1.8}}
    ]
  };

  if(!chart1)chart1=echarts.init(document.getElementById('chart1'));
  if(!chart2)chart2=echarts.init(document.getElementById('chart2'));
  if(!chart3)chart3=echarts.init(document.getElementById('chart3'));
  chart1.setOption(opt1,true);
  chart2.setOption(opt2,true);
  chart3.setOption(repoOption(repo.map(r=>r.date),repo),true);
  chart1.group='liquidity-group';chart2.group='liquidity-group';
  echarts.connect('liquidity-group');

  const repoRange=repo.length?'；质押式回购：'+repo[0].date+' 至 '+repo[repo.length-1].date+'（'+repo.length+' 天）':'；暂无质押式回购数据';
  document.getElementById('status').textContent='页面生成：'+GENERATED_AT+repoRange+'｜拖入最新 liquidity_data.xlsx 可刷新全部图表';
}

function updateOmoOverrideStatus(){
  const active=[];
  if(customOmo1d!=null)active.push('1D '+customOmo1d.toFixed(2)+'%');
  if(customOmo7d!=null)active.push('7D '+customOmo7d.toFixed(2)+'%');
  document.getElementById('omoOverrideStatus').textContent=active.length
    ? '当前自定义覆盖：'+active.join('；')+'（仅当前页面，未改写 Excel）'
    : '留空使用数据表默认 OMO 利率；自定义值仅覆盖当前页面，不改写 Excel';
}

function readOmoOverride(id){
  const text=document.getElementById(id).value.trim();
  if(text==='')return null;
  const value=Number(text);
  if(!Number.isFinite(value)||value<0||value>20)throw new Error('OMO 利率应为 0—20 之间的数字');
  return value;
}

function applyCustomOmo(){
  try{
    customOmo1d=readOmoOverride('customOmo1d');
    customOmo7d=readOmoOverride('customOmo7d');
    render();
    updateOmoOverrideStatus();
  }catch(err){alert(err.message);}
}

document.getElementById('applyOmoBtn').addEventListener('click',applyCustomOmo);
document.getElementById('resetOmoBtn').addEventListener('click',()=>{
  customOmo1d=null;customOmo7d=null;
  document.getElementById('customOmo1d').value='';
  document.getElementById('customOmo7d').value='';
  render();updateOmoOverrideStatus();
});
['customOmo1d','customOmo7d'].forEach(id=>document.getElementById(id).addEventListener('keydown',e=>{
  if(e.key==='Enter')applyCustomOmo();
}));

const dz=document.getElementById('dropzone');
const fi=document.getElementById('fileInput');
dz.addEventListener('click',()=>fi.click());
dz.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fi.click();}});
['dragover','dragenter'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('dragover');}));
['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('dragover');}));
dz.addEventListener('drop',e=>{if(e.dataTransfer.files.length)handleFile(e.dataTransfer.files[0]);});
fi.addEventListener('change',e=>{if(e.target.files.length)handleFile(e.target.files[0]);});

function handleFile(file){
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{raw:true});
      rawData=rows;
      rawRepoData=wideToRepo(rows);
      render();
      dz.querySelector('.hint-strong').textContent='已载入：'+file.name+'（'+rows.length+' 条）';
    }catch(err){alert('文件解析失败：'+err.message);}
  };
  reader.readAsArrayBuffer(file);
}

window.addEventListener('resize',()=>{chart1&&chart1.resize();chart2&&chart2.resize();chart3&&chart3.resize();});
render();

</script>
</body>
</html>
