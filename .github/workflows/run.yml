name: Run Script in Cloud

on:
  workflow_dispatch: # 這會讓 GitHub 網頁上出現一個手動執行的按鈕

permissions:
  contents: write

jobs:
  run-cloud-script:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pandas openpyxl

    - name: Run specific python script
      run: python rmb_liquidity/liquidity.py

    - name: Commit and push changes back
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git diff --quiet && git diff --staged --quiet || (git commit -m "Cloud run update data [skip ci]" && git push)
