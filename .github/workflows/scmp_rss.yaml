name: SCMP RSS Collector

on:
  workflow_dispatch: # 支援在 GitHub 網頁上手動觸發
  schedule:
    - cron: '0 */3 * * *' # 每隔 3 小時執行一次

permissions:
  contents: write

jobs:
  scmp-job:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run SCMP Collector
      run: |
        # 進入 scmp 資料夾執行指令碼
        cd scmp
        python rss_scmp_collector_v2.py

    - name: Commit and push txt file
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        # 僅將 scmp 資料夾中產生的 txt 變更加入並提交
        git add scmp/scmp_*.txt
        git diff --quiet && git diff --staged --quiet || (git commit -m "Add latest SCMP daily summary in scmp folder [skip ci]" && git push)