name: SCMP RSS Collector

on:
  workflow_dispatch: # 支援在 GitHub 網頁上手動觸發
  schedule:
    - cron: '0 */4 * * *' # 每隔 4 小時執行一次（你也可以按需改回 '0 */3 * * *'）

permissions:
  contents: write

jobs:
  scmp-job:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run SCMP Collector
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # 注入 GitHub Secrets 密鑰
      run: |
        # 進入 scmp 資料夾執行最新版本的腳本
        cd scmp
        python rss_scmp_collector_v3.py

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # 同時將 scmp 資料夾內的 json 歷史庫與 epub 檔案加入版本控制
        git add scmp/scmp_archive.json scmp/scmp_*.epub
        
        # 如果沒有任何變更則跳過提交，有變更則自動 commit 並 push
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update SCMP archive and EPUB ebook [skip ci]" && git push)