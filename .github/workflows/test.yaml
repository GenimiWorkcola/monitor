name: Manual Test Runner

on:
  workflow_dispatch: # 核心：开启网页手动触发按钮

# 赋予 GITHUB_TOKEN 写入仓库代码的权限
permissions:
  contents: write

jobs:
  run-test-job:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi

    - name: Run test script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        # 切换到 test 文件夹并运行你的脚本
        cd test
        python test.py

    - name: Commit and push generated files
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        
        # 【核心修改】直接追踪 test 文件夹下的所有新文件、修改或删除的文件，不管是什么后缀（png, csv, html 等）
        git add test/
        
        # 检查是否有改动，有则提交并推送
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update files generated by test script" && git push)