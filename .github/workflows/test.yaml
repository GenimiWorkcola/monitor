name: Manual Test Runner

on:
  workflow_dispatch: # 核心：開啟网页手动触发按钮

jobs:
  run-test-job:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi

    - name: Run test script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        # 切换到 test 文件夹并运行你的脚本
        cd test
        python test.py

    # 【自動推送回倉庫】：不需要打包，直接把生成的圖片同步到 GitHub
    - name: Commit and push generated PNG
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add test/method_a_with_liquidity_colorbar.png
        # 如果圖片有變更才提交，避免空提交报错
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update liquidity colorbar chart PNG" && git push)