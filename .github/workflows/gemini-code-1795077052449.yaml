name: SCMP RSS Collector[cite: 22]

on:
  workflow_dispatch: # 支援在 GitHub 網頁上手動觸發
  schedule:
    - cron: '0 */4 * * *' # 每隔 4 小時執行一次（你也可以按需改回 '0 */3 * * *'）[cite: 22]

# 同一工作流/分支同時只保留一個執行實例，避免前次未結束時排隊堆積
concurrency:
  group: scmp-rss-collector-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write[cite: 22]

jobs:
  scmp-job:
    runs-on: ubuntu-latest[cite: 22]
    timeout-minutes: 15 # 超過 15 分鐘自動強制終止，避免長時間卡死[cite: 22]
    
    steps:
    - name: Checkout repository[cite: 22]
      uses: actions/checkout@v4[cite: 22]

    - name: Set up Python[cite: 22]
      uses: actions/setup-python@v5[cite: 22]
      with:
        python-version: '3.10'[cite: 22]

    - name: Install dependencies[cite: 22]
      run: |
        python -m pip install --upgrade pip[cite: 22]
        pip install -r requirements.txt[cite: 22]

    - name: Run SCMP Collector[cite: 22]
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # 注入 GitHub Secrets 密鑰[cite: 22]
      run: |
        # 進入 scmp 資料夾執行最新版本的腳本[cite: 22]
        cd scmp[cite: 22]
        python -u rss_scmp_collector_v2.py[cite: 22]

    - name: Commit and push changes[cite: 22]
      run: |
        git config --global user.name "github-actions[bot]"[cite: 22]
        git config --global user.email "github-actions[bot]@users.noreply.github.com"[cite: 22]
        
        # 同時將 scmp 資料夾內的 json 歷史庫與 epub 檔案加入版本控制[cite: 22]
        git add scmp/scmp_archive.json scmp/scmp_*.epub[cite: 22]
        
        # 如果沒有任何變更則跳過提交，有變更則自動 commit 並 push[cite: 22]
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update SCMP archive and EPUB ebook [skip ci]" && git push)[cite: 22]